<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Érzelem dobókocka</title>

  <style>
    :root {
      --bg: #f5f1eb;
      --shadow: rgba(38, 28, 20, 0.22);
      --edge: rgba(255, 255, 255, 0.38);
      --cube-size: min(68vw, 320px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow: hidden; }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 38%, rgba(255,255,255,0.75), transparent 28%),
        radial-gradient(circle at 50% 78%, rgba(1,105,111,0.10), transparent 20%),
        var(--bg);
      font-family: Arial, sans-serif;
    }

    .scene {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      perspective: 1400px;
    }

    .cube-wrap {
      display: grid;
      place-items: center;
      transform: translateY(-12px);
    }

    .cube {
      position: relative;
      width: var(--cube-size);
      height: var(--cube-size);
      transform-style: preserve-3d;
      transform: rotateX(-28deg) rotateY(32deg);
      transition: transform 8.5s cubic-bezier(0.12, 0.88, 0.18, 1);
    }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: #fff;
      font-weight: 700;
      font-size: clamp(1.35rem, 1rem + 1.8vw, 2.2rem);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      border: 2px solid var(--edge);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      user-select: none;
    }

    .front  { background: linear-gradient(155deg, #f06f5d, #b9342a); transform: rotateY(0deg) translateZ(calc(var(--cube-size) / 2)); }
    .back   { background: linear-gradient(155deg, #62c97b, #237644); transform: rotateY(180deg) translateZ(calc(var(--cube-size) / 2)); }
    .right  { background: linear-gradient(155deg, #63d0dc, #0f7f8f); transform: rotateY(90deg) translateZ(calc(var(--cube-size) / 2)); }
    .left   { background: linear-gradient(155deg, #7390ff, #3448b8); transform: rotateY(-90deg) translateZ(calc(var(--cube-size) / 2)); }
    .top    { background: linear-gradient(155deg, #efba5c, #cc8316); transform: rotateX(90deg) translateZ(calc(var(--cube-size) / 2)); }
    .bottom { background: linear-gradient(155deg, #ab82e3, #6c3dbc); transform: rotateX(-90deg) translateZ(calc(var(--cube-size) / 2)); }

    .shadow {
      width: min(48vw, 250px);
      height: 28px;
      margin-top: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--shadow) 0%, rgba(38, 28, 20, 0.08) 52%, transparent 74%);
      filter: blur(6px);
    }

    .kinect-status {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.88);
      color: #444;
      font-size: 13px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    .kinect-status.connected {
      color: #146b3a;
    }

    .kinect-status.error {
      color: #a4262c;
    }

    @media (max-width: 520px) {
      :root { --cube-size: min(74vw, 270px); }
      .shadow { width: min(56vw, 210px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cube { transition-duration: 0.01ms !important; }
    }
  </style>
</head>

<body>
  <main class="scene" aria-label="Érzelem dobókocka">
    <div class="cube-wrap">
      <div class="cube" id="cube">
        <div class="face front">Harag</div>
        <div class="face back">Öröm</div>
        <div class="face right">Bánat</div>
        <div class="face left">Félelem</div>
        <div class="face top">Közöny</div>
        <div class="face bottom">Meglepetés</div>
      </div>

      <div class="shadow" aria-hidden="true"></div>
    </div>
  </main>

  <div class="kinect-status" id="kinectStatus">
    Kinect-híd: nincs kapcsolat
  </div>

  <script>
    (() => {
      const cube = document.getElementById('cube');
      const statusBox = document.getElementById('kinectStatus');

      const faces = [
        { x: 0, y: 0 },
        { x: 0, y: 180 },
        { x: 0, y: -90 },
        { x: 0, y: 90 },
        { x: -90, y: 0 },
        { x: 90, y: 0 }
      ];

      let rotationX = 0;
      let rotationY = 0;
      let rolling = false;

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function applyRotation() {
        cube.style.transform =
          `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
      }

      function roll(direction = 'right') {
        if (rolling) return;

        rolling = true;

        const face = faces[Math.floor(Math.random() * faces.length)];
        const fullTurnsX = rand(3, 5) * 360;
        const fullTurnsY = rand(4, 6) * 360;

        if (direction === 'right') {
          rotationX = face.x + fullTurnsX;
          rotationY = face.y + fullTurnsY;
        } else {
          rotationX = face.x - fullTurnsX;
          rotationY = face.y - fullTurnsY;
        }

        applyRotation();

        window.setTimeout(() => {
          rolling = false;
        }, 8500);
      }

      /*
        Megmarad a billentyűzetes vezérlés.
      */
      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight') {
          event.preventDefault();
          roll('right');
        }

        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          roll('left');
        }
      });

      function setKinectStatus(text, state) {
        statusBox.textContent = text;
        statusBox.className = 'kinect-status';

        if (state) {
          statusBox.classList.add(state);
        }
      }

      /*
        A helyben futó Kinect-hídprogram WebSocket címe.
        A hídprogram "left" vagy "right" szöveget küld.
      */
      const KINECT_BRIDGE_URL = 'ws://localhost:8182/';

      let bridgeSocket = null;

      function connectKinectBridge() {
        try {
          bridgeSocket = new WebSocket(KINECT_BRIDGE_URL);

          bridgeSocket.addEventListener('open', () => {
            setKinectStatus(
              'Kinect-híd: kapcsolódva. Bal kéz = balra, jobb kéz = jobbra.',
              'connected'
            );
          });

          bridgeSocket.addEventListener('message', (event) => {
            const command = String(event.data).trim().toLowerCase();

            if (command === 'left') {
              roll('left');
            }

            if (command === 'right') {
              roll('right');
            }
          });

          bridgeSocket.addEventListener('close', () => {
            setKinectStatus(
              'Kinect-híd: kapcsolat megszakadt; újracsatlakozás…',
              'error'
            );

            window.setTimeout(connectKinectBridge, 3000);
          });

          bridgeSocket.addEventListener('error', () => {
            setKinectStatus(
              'Kinect-híd: nem érhető el a ws://localhost:8182 címen.',
              'error'
            );
          });

        } catch (error) {
          setKinectStatus(
            'Kinect-híd: WebSocket hiba.',
            'error'
          );

          window.setTimeout(connectKinectBridge, 3000);
        }
      }

      window.rollEmotionDice = roll;

      applyRotation();
      connectKinectBridge();
    })();
  </script>
</body>
</html>
